[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ssa-paper-code"
version = "0.1.0"
description = "Minimal code to reproduce the PQ importance sampling (PQIS) benchmark"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"

dependencies = [
    "torch>=2.7.1",
    "transformers>=4.55.0",
    "accelerate>=0.20.0",
    "datasets>=2.0.0",
    "numpy>=1.21.0",
    "pandas>=2.0.0",
    "tqdm>=4.64.0",
    "scikit-learn>=1.0.0",
    "sentencepiece>=0.2.1",
    "rouge>=1.0.0",
    "jieba>=0.42.0",
    "fuzzywuzzy>=0.18.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["sparse_attention_hub*", "benchmark*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["--strict-markers", "-q"]
markers = [
    "unit: marks tests as unit tests",
]
